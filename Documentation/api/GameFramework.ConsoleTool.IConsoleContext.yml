  source:
    id: SetWaitForLoad
    path: ''
    startLine: 2598
  assemblies:
  - cs.temp.dll
  namespace: GameFramework.ConsoleTool
  summary: "\nSets a flag to wait for level/scene loading to complete before processing next command\nEssential for commands that depend on scene state or need to execute after scene transitions\nCommand execution will pause until the current level finishes loading\n"
  example: []
  syntax:
    content: void SetWaitForLoad(bool wait)
    parameters:
    - id: wait
      type: System.Boolean
      description: True to wait for level load completion, false to continue normally
    content.vb: Sub SetWaitForLoad(wait As Boolean)
  overload: GameFramework.ConsoleTool.IConsoleContext.SetWaitForLoad*
