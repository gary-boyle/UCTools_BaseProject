    startLine: 1054
  assemblies:
  - cs.temp.dll
  namespace: GameFramework.ConsoleTool
  summary: "\nConsole GUI component responsible for rendering console UI and handling user input.\n\nArchitecture:\n- Pure UI component - only handles visual representation\n- Subscribes to console-specific input events (not toggle - that&apos;s handled by ConsoleService)\n- Uses events to communicate back to console system\n- Optimized string building for better performance\n\nInput Handling Flow:\n1. InputManager detects console input (submit, tab, history) \n2. InputManager publishes console input events\n3. ConsoleGUI receives events and updates UI accordingly\n4. ConsoleGUI calls Console static methods to execute commands\n"
  example: []
  syntax:
    content: 'public class ConsoleGUI : MonoBehaviour, IConsoleUI'
    content.vb: >-
      Public Class ConsoleGUI
          Inherits MonoBehaviour
          Implements IConsoleUI
  inheritance:
  - System.Object
  implements:
