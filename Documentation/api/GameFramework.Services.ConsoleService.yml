  type: Class
  source:
    id: ConsoleService
    path: ''
    startLine: 7799
  assemblies:
  - cs.temp.dll
  namespace: GameFramework.Services
  summary: "\nService that orchestrates the debug console system using dependency injection.\n\nArchitecture:\n- Manages console state (open/closed)\n- Provides public API for other systems to interact with console\n- Respects debug settings from configuration\n- Input conflict management is handled by ConsoleInputHandler\n\nFlow:\n1. Receives toggle input events from InputManager\n2. Checks if console is enabled in debug settings\n3. Updates console open/closed state only if enabled\n4. ConsoleInputHandler automatically manages input conflicts by checking IsConsoleOpen()\n5. Delegates UI updates to ConsoleGUI via Console static class\n"
  example: []
  syntax:
    content: 'public class ConsoleService : IConsoleService'
    content.vb: >-
      Public Class ConsoleService
          Inherits IConsoleService
  inheritance:
